<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 620" width="1500" height="620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <marker id="arrowBack" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#4a5568"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1500" height="620" fill="#ffffff"/>

  <!-- title -->
  <text x="40" y="52" font-size="26" font-weight="700" fill="#1a202c">CAE scheduler — single process, one queue, one clock</text>
  <text x="40" y="82" font-size="17" fill="#4a5568">Every coordination decision flows through the SQLite store. No daemon, no IPC.</text>

  <!-- CLI -->
  <rect x="50" y="240" width="220" height="110" rx="10" fill="#edf2f7" stroke="#2d3748" stroke-width="2"/>
  <text x="160" y="285" font-size="21" font-weight="700" text-anchor="middle" fill="#1a202c">CLI</text>
  <text x="160" y="312" font-size="15" text-anchor="middle" fill="#4a5568">submit · cancel</text>
  <text x="160" y="333" font-size="15" text-anchor="middle" fill="#4a5568">status · drain · run</text>

  <!-- Scheduler -->
  <rect x="430" y="215" width="290" height="160" rx="10" fill="#e6f0fb" stroke="#2b6cb0" stroke-width="3"/>
  <text x="575" y="262" font-size="23" font-weight="700" text-anchor="middle" fill="#1a365d">Scheduler</text>
  <text x="575" y="292" font-size="15" text-anchor="middle" fill="#2c5282">single global priority queue</text>
  <text x="575" y="315" font-size="15" text-anchor="middle" fill="#2c5282">age-based promotion (R01)</text>
  <text x="575" y="345" font-size="14" text-anchor="middle" fill="#4a5568">execution module</text>

  <!-- Worker pool -->
  <rect x="900" y="120" width="270" height="150" rx="10" fill="#edf2f7" stroke="#2d3748" stroke-width="2"/>
  <text x="1035" y="163" font-size="21" font-weight="700" text-anchor="middle" fill="#1a202c">Worker Pool</text>
  <text x="1035" y="190" font-size="15" text-anchor="middle" fill="#4a5568">fixed threads, not tokio (D3)</text>
  <rect x="930" y="208" width="60" height="38" rx="5" fill="#ffffff" stroke="#718096"/>
  <rect x="1005" y="208" width="60" height="38" rx="5" fill="#ffffff" stroke="#718096"/>
  <rect x="1080" y="208" width="60" height="38" rx="5" fill="#ffffff" stroke="#718096"/>
  <text x="960" y="233" font-size="14" text-anchor="middle" fill="#4a5568">w1</text>
  <text x="1035" y="233" font-size="14" text-anchor="middle" fill="#4a5568">w2</text>
  <text x="1110" y="233" font-size="14" text-anchor="middle" fill="#4a5568">wN</text>

  <!-- RetryManager -->
  <rect x="900" y="330" width="270" height="120" rx="10" fill="#fdf0e6" stroke="#c05621" stroke-width="2"/>
  <text x="1035" y="372" font-size="21" font-weight="700" text-anchor="middle" fill="#7b341e">RetryManager</text>
  <text x="1035" y="399" font-size="15" text-anchor="middle" fill="#9c4221">exponential backoff</text>
  <text x="1035" y="422" font-size="15" text-anchor="middle" fill="#9c4221">dead-letter after retry_limit</text>

  <!-- TaskStore -->
  <rect x="430" y="460" width="290" height="115" rx="10" fill="#e9f5ec" stroke="#276749" stroke-width="3"/>
  <text x="575" y="503" font-size="21" font-weight="700" text-anchor="middle" fill="#1c4532">TaskStore</text>
  <text x="575" y="530" font-size="15" text-anchor="middle" fill="#276749">SQLite, operator-readable (D1/D2)</text>
  <text x="575" y="553" font-size="14" text-anchor="middle" fill="#4a5568">store module</text>

  <!-- edges -->
  <line x1="270" y1="295" x2="424" y2="295" stroke="#4a5568" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="347" y="283" font-size="14" text-anchor="middle" fill="#4a5568">submit</text>

  <line x1="720" y1="265" x2="894" y2="200" stroke="#4a5568" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="800" y="216" font-size="14" text-anchor="middle" fill="#4a5568">dispatch</text>

  <line x1="720" y1="340" x2="894" y2="378" stroke="#4a5568" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="806" y="376" font-size="14" text-anchor="middle" fill="#9c4221">on failure</text>

  <line x1="1035" y1="270" x2="1035" y2="324" stroke="#4a5568" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1048" y="302" font-size="14" fill="#4a5568">Err</text>

  <line x1="575" y1="375" x2="575" y2="454" stroke="#4a5568" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrowBack)"/>
  <text x="592" y="420" font-size="14" fill="#276749">persist / load</text>

  <path d="M 160 350 L 160 517 L 424 517" fill="none" stroke="#718096" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="250" y="507" font-size="14" fill="#718096">short-lived commands read the store directly</text>

  <path d="M 1035 450 L 1035 517 L 726 517" fill="none" stroke="#718096" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="900" y="507" font-size="14" text-anchor="middle" fill="#718096">reschedule</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1119" height="226" viewBox="0 0 1119 226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
<rect width="1119" height="226" rx="10" fill="#0d1117"/>
<text x="24" y="35" xml:space="preserve" textLength="882.0" lengthAdjust="spacingAndGlyphs">
<tspan fill="#79c0ff">example-project</tspan><tspan fill="#c9d1d9"> --help                                                       </tspan><tspan fill="#8b949e"># Show this help text</tspan>
</text>
<text x="24" y="58.2" xml:space="preserve" textLength="828.0" lengthAdjust="spacingAndGlyphs">
<tspan fill="#79c0ff">example-project</tspan><tspan fill="#c9d1d9"> --version                                                    </tspan><tspan fill="#8b949e"># Print version</tspan>
</text>
<text x="24" y="81.5" xml:space="preserve" textLength="981.0" lengthAdjust="spacingAndGlyphs">
<tspan fill="#79c0ff">example-project</tspan><tspan fill="#c9d1d9"> submit --deadline &lt;t&gt; [--retry N] [--priority 0-9] -- &lt;cmd&gt;  </tspan><tspan fill="#8b949e"># Enqueue a task at the deadline</tspan>
</text>
<text x="24" y="104.8" xml:space="preserve" textLength="999.0" lengthAdjust="spacingAndGlyphs">
<tspan fill="#79c0ff">example-project</tspan><tspan fill="#c9d1d9"> status [--json] [--filter &lt;state&gt;]                           </tspan><tspan fill="#8b949e"># Show task states and queue depth</tspan>
</text>
<text x="24" y="128.0" xml:space="preserve" textLength="954.0" lengthAdjust="spacingAndGlyphs">
<tspan fill="#79c0ff">example-project</tspan><tspan fill="#c9d1d9"> cancel &lt;task-id&gt;                                             </tspan><tspan fill="#8b949e"># Cancel a pending task by ID</tspan>
</text>
<text x="24" y="151.2" xml:space="preserve" textLength="1035.0" lengthAdjust="spacingAndGlyphs">
<tspan fill="#79c0ff">example-project</tspan><tspan fill="#c9d1d9"> drain [--timeout &lt;sec&gt;]                                      </tspan><tspan fill="#8b949e"># Wait for all pending tasks to finish</tspan>
</text>
<text x="24" y="174.5" xml:space="preserve" textLength="1071.0" lengthAdjust="spacingAndGlyphs">
<tspan fill="#79c0ff">example-project</tspan><tspan fill="#c9d1d9"> pause                                                        </tspan><tspan fill="#8b949e"># Stop dispatching new tasks (maintenance)</tspan>
</text>
<text x="24" y="197.8" xml:space="preserve" textLength="873.0" lengthAdjust="spacingAndGlyphs">
<tspan fill="#79c0ff">example-project</tspan><tspan fill="#c9d1d9"> resume                                                       </tspan><tspan fill="#8b949e"># Resume dispatching</tspan>
</text>
</svg>
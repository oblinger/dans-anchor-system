# Warden rule-system test suite (F214).
#
# Runs the layers that exist today — the engine unit tests, the golden corpus,
# and the Python↔engine differential — as gates. Perf / e2e layers join as
# their milestones land (F214 § Design). This workflow migrates wholesale when
# Warden extracts to its own repo (F214 Q1 resolution, 2026-07-01).

name: warden-tests

on:
  push:
    branches: [main]
    paths:
      - "warden/**"
      - "skills/audit/scripts/**"
      - ".github/workflows/warden-tests.yml"
  pull_request:
    paths:
      - "warden/**"
      - "skills/audit/scripts/**"
      - ".github/workflows/warden-tests.yml"
  workflow_dispatch:

jobs:
  golden-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Engine unit tests
        run: |
          for t in scan compile fire engine docfire hook daemon; do
            echo "== test_warden_$t =="
            python3 "warden/engine/test_warden_$t.py"
          done

      - name: Golden corpus (audit-plan engine)
        run: python3 "warden/Warden Corpus/harness/run-corpus.py"

      - name: Golden corpus (warden reference engine — differential)
        run: python3 "warden/Warden Corpus/harness/run-corpus.py" --engine warden

  rust-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build + unit-test the Rust engine (F213)
        run: |
          cargo test --release --manifest-path warden/rs/Cargo.toml

      - name: Compile the corpus (live IR for the differential)
        run: python3 warden/engine/warden compile

      - name: Rust ↔ Python differential (F213 / F214 differential gate)
        env:
          WARDEN_RS_BIN: warden/rs/target/release/warden-rs
        run: python3 warden/engine/test_warden_rust.py

      - name: Rust hook ↔ Python hook differential (F213 phase 2 — live dispatcher)
        run: python3 warden/engine/test_warden_hook_rust.py

      - name: Perf gate (F214 perf layer — fails on hot-path regression)
        run: python3 warden/engine/test_warden_perf.py
